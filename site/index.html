function cellClick(id){if(S.phase!=='playing')return;const other=occupied(id);if(other){S.selected=other.uid;S.mode='move';save();render();return}let i=get(S.selected);if(!i){toast('先选一匾晒物');return}let kind=i.location==='yard'?'move':'place';action(kind,i.uid,id)}
function selectItem(uid){S.selected=uid;S.mode=get(uid).location==='yard'?'move':'place';save();render()}
function handleTool(kind){if(!S.selected){toast('先选一匾晒物');return}const i=get(S.selected);if(kind==='move'){if(i.location==='yard'){S.mode='move';toast('点一块空地移动竹匾');save();render()}else toast('先把晒物摆到院子里');return}action(kind,i.uid,null)}
function advance(){if(S.phase!=='playing')return;const weather=weatherSeq[S.turn];const w=WEATHERS[weather];let report=[];
 for(const i of S.items){if(i.location!=='yard'||i.spoiled)continue;const tile=BOARD[i.cell];const item=ITEMS[i.type];
  if(weather==='rain'&&!i.covered&&tile.type!=='eave'){i.dry=Math.max(0,i.dry-15);i.mold+=item.tags.includes('rain_fear')?2:1;report.push(`${item.name}淋雨了`);if(i.mold>=3){i.spoiled=true;i.location='spoiled';i.cell=null;report.push(`${item.name}发霉了`)}continue}
  if(weather==='wind'&&item.tags.includes('light')&&!i.pressed&&tile.type!=='eave'){i.spoiled=true;i.location='spoiled';i.cell=null;report.push(`${item.name}被吹走啦`);continue}
  if(i.covered)continue;
  let cellFactor={sun:1,shade:.5,eave:.5,airy:1,stone:1}[tile.type];let delta=4*w.strength*cellFactor*item.dry;
  if(weather==='sun'&&tile.type==='sun'&&item.tags.includes('sun_fear'))delta*=1.5;
  if(item.tags.includes('needs_wind'))delta*=tile.type==='airy'?1.3:.7;
  if(weather==='fog'&&tile.type!=='eave')delta-=3;
  const before=i.dry;i.dry=Math.max(0,Math.min(100,Math.round(i.dry+delta)));
  if(before<item.green[0]&&i.dry>=item.green[0]&&i.dry<=item.green[1])report.push(`${item.name}晒得刚好！`);
 }
 S.actionLog.push({t:S.turn,kind:'advance',weather});S.turn++;S.ap=3;S.mode='place';
 if(S.turn>=6){let score=S.items.reduce((acc,i)=>acc+worth(i),0);let max=S.items.reduce((acc,i)=>acc+Math.round(ITEMS[i.type].value*1.5),0);let ratio=score/max;let stars=ratio>=.9?3:ratio>=.7?2:ratio>=.4?1:0;let earned=Math.max(5,score);S.coins+=earned;S.phase='done';S.result={score,earned,stars,rows:S.items.map(i=>({name:ITEMS[i.type].name,grade:grade(i),dry:i.dry,worth:worth(i)}))};}
 save();render();if(report.length)toast(report[0]);
}
function restart(){S=defaultState();S.screen='game';save();render()}
function logo(){return `<svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="25" r="15" fill="#f5be6b"/><path d="M19 43h34v10H13V43l6 -6h28l6 6" fill="#cb8958" stroke="#966b49" stroke-width="3"/><path d="M17 47h32M22 39v13M32 39v13M42 39v13" stroke="#f4d3a2" stroke-width="3"/><path d="M30 20q7 2 4 9" stroke="#d99750" fill="none" stroke-width="2"/></svg>`}
function home(){return `<main class="screen"><div class="topbar"><div class="brand"><div class="logo">${logo()}</div><div><div class="brandTitle">今日宜晒</div><div class="brandSub">A LITTLE SUNSHINE EVERY DAY</div></div></div><button class="tinyBtn" data-act="help">玩法说明</button></div><p class="subtitle">✦ 二 十 四 节 气 · 小 院 日 常 ✦</p><h1 class="bigtitle">把日子<br>晒得刚刚好</h1><div class="tagline">天晴晒萝卜，雨来收柿饼。<br>在自己的小院里，晒出四季好时光。</div><div class="homeScene">${homeSVG}<div class="floatingLeaf">🍃</div></div><div class="pills"><span class="pill">☀ 看天晾晒</span><span class="pill">🍂 抢在雨前</span><span class="pill">✦ 收获刚好</span></div><button class="primary" data-act="start">${S.turn>0&&S.phase==='playing'?'继续今天的晒场':'开始晒晒 · 试玩第一天'}　→</button><div class="homeFoot"><span>原创小院风</span><span>无需登录</span><span>本地进度保存</span></div><div class="metaRibbon">P1a 玩法纵切版 · 仅供内部试玩 · 无真实广告</div></main>`}
function game(){let w=weatherSeq[Math.min(S.turn,5)], weather=WEATHERS[w];let active=S.items.find(x=>x.uid===S.selected);let hint=S.turn===0?'先选择篮中的晒物，再点院子里的空格。':S.turn===3?'这回合是雨天！先把东西收进屋，或盖竹罩。':S.turn===5?'最后一个时辰，记得把干度锁在绿色区间！':'观察天气和干度，选择「日头往前走」。';
const timeline=HOURS.map((h,t)=>`<div class="tick ${t===S.turn?'current':t<S.turn?'past':''}"><span class="tickName">${h}时</span><div class="tickIcon">${WEATHERS[weatherSeq[t]].icon}</div></div>`).join('');
const cells=BOARD.map(c=>{let i=occupied(c.id);let isSelected=i?.uid===S.selected;let label={sun:'☀',shade:'荫',eave:'檐'}[c.type]||'☀';return `<button class="cell ${c.type==='sun'?'sunny':c.type} ${isSelected?'selected':''}" data-cell="${c.id}" aria-label="${c.id+1}号格 ${c.type} ${i?ITEMS[i.type].name:'空地'}"><span class="cellMark">${label}</span>${i?`<span class="cellItem">${SVG[ITEMS[i.type].shape]}</span><span class="cellBadge">${i.covered?'罩':i.pressed?'压':i.dry+'%'}</span><span class="cellDry"><b style="width:${i.dry}%"></b></span>`:''}</button>`}).join('');
const items=S.items.map(i=>{let meta=ITEMS[i.type];let [a,b]=meta.green;return `<button class="itemCard ${S.selected===i.uid?'active':''}" data-item="${i.uid}"><span class="itemIllustration">${SVG[meta.shape]}</span><span class="itemWords"><div class="itemName">${meta.name} ${i.location==='inside'?'🏠':''}</div><div class="itemState">${status(i)} · ${i.dry}/${a}–${b}</div><div class="progress"><b style="width:${i.dry}%"></b><em style="left:${a}%;width:${b-a}%"></em></div></span></button>`}).join('');
const rainLines=w==='rain'?Array.from({length:16},(_,t)=>`<i class="rainDrop" style="left:${(t*73)%100}%;top:${(t*41)%69}px;animation-delay:-${(t%6)*.12}s"></i>`).join(''):'';
return `<main class="screen"><header class="topGame"><div><div class="stageMeta">立秋 · 晒谷坪 · P1a 试玩</div><div class="stageTitle">第一天的小院 🌾</div></div><div style="display:flex;gap:5px;align-items:center"><span class="coinTag"><span class="coinCircle">¥</span>${S.coins}</span><button class="tinyBtn" data-act="home">⌂</button></div></header><div class="timeline" aria-label="今天的六个时辰天气">${timeline}</div><section class="scene ${w==='rain'?'rainy':''}"><div class="sceneTop"><span class="sceneTitle">${HOURS[S.turn]}时 · ${weather.label}天 ${weather.icon}</span><div class="sceneSun"></div><div class="cloud"></div>${rainLines}</div><div class="yardWall"></div><div class="tileBoard">${cells}</div><div class="sceneNote">${active?`${ITEMS[active.type].name}｜目标 ${ITEMS[active.type].green.join('–')}｜当前 ${active.dry}`:'选一件晒物开始'}</div></section><div class="message"><span class="bubble">💬</span><span>${hint}</span></div><div class="itemBarTitle"><span>🧺 今天要晒的</span><span>绿色区间 = 刚刚好</span></div><div class="itemTray">${items}</div><div class="actions"><button class="action" data-tool="move" ${!active||active.location!=='yard'?'disabled':''}>♧ 移位置</button><button class="action" data-tool="cover" ${!active||active.location!=='yard'||active.covered?'disabled':''}>▤ 盖竹罩</button><button class="action" data-tool="collect" ${!active||active.location!=='yard'?'disabled':''}>⌂ 收进屋</button><button class="action" data-tool="press" ${!active||active.location!=='yard'||active.pressed?'disabled':''}>◇ 压石头</button></div><div class="bottom"><span class="ap">🍃 还可做 ${S.ap} 步</span><button class="primary" data-act="advance">${S.turn===5?'日落 · 看收成':'日头往前走'}　→</button></div><div class="hintExtra">放置与收取都消耗1步 · 每时辰恢复3步 · <a href="#" data-act="reset" style="color:#b18a75">重开这天</a></div></main>`}
function result(){let r=S.result;let rows=r.rows.map(x=>`<div class="resultRow"><span>${x.name} · 晒到 ${x.dry}</span><span>${x.grade==='优'?'🌟':x.grade==='良'?'🌿':x.grade==='差'?'🍂':'🌧'} ${x.grade}　+${x.worth}</span></div>`).join('');return `<main class="screen"><div class="topbar"><div class="brand"><div class="logo">${logo()}</div><div><div class="brandTitle">今日宜晒</div><div class="brandSub">SUNSET SUMMARY</div></div></div><button class="tinyBtn" data-act="home">回首页</button></div><div style="margin:25px -6px 16px" class="homeScene">${homeSVG}</div><div class="resultHead">今天的太阳下山了</div><div class="resultTitle" style="text-align:center">${r.stars===3?'满满一匾好时光':r.stars===2?'今天晒得不错':r.stars===1?'明天会更好':'雨过总会天晴'}</div><div class="stars" style="text-align:center">${'★'.repeat(r.stars)}<span style="opacity:.23">${'☆'.repeat(3-r.stars)}</span></div><div class="resultScore" style="text-align:center">晒场得分 <b>${r.score}</b> · 铜钱 +<b>${r.earned}</b></div><div class="resultList">${rows}</div><div style="margin:18px 0 12px;color:#6b806d;font-size:13px;text-align:center">🌿 你知道吗？真正的好收成，要懂得及时收手。</div><button class="primary" data-act="restart">再晒一天　↻</button><div class="footerFine" style="text-align:center">P1a仅含1个教学体验关，更多节气与小院尚未实装</div></main>`}
function help(){return `<div class="overlay" data-overlay="1"><div class="dialog"><div class="resultHead">小院玩法 · 只需要三步</div><div class="resultTitle">晒得刚刚好 ☀</div><div style="text-align:left;font-size:14px;line-height:2;color:#657c66;margin:10px 4px 22px">① 点下方萝卜/柿饼，再点院中空格摆竹匾。<br>② 点「日头往前走」，看晒物干度上涨。<br>③ 快到绿色目标区间时，点物品后「收进屋」；雨天尤其要保护它们。<br><br><b>目标：</b>尽量在绿区内收好，日落获得更多铜钱和星星。</div><button class="primary" data-act="dismiss">知道啦，去晒晒</button></div></div>`}
function render(){const app=document.querySelector('#app');app.innerHTML=S.screen==='home'?home():S.phase==='done'?result():game();if(showHelp)app.insertAdjacentHTML('beforeend',help());save()}
document.querySelector('#app').addEventListener('click',e=>{const btn=e.target.closest('[data-act],[data-item],[data-cell],[data-tool]');if(!btn)return;e.preventDefault();if(btn.dataset.item){selectItem(btn.dataset.item);return}if(btn.dataset.cell!==undefined){cellClick(Number(btn.dataset.cell));return}if(btn.dataset.tool){handleTool(btn.dataset.tool);return}switch(btn.dataset.act){case 'start':if(S.phase==='done')restart();else{S.screen='game';render()}break;case 'home':S.screen='home';showHelp=false;render();break;case 'advance':advance();break;case 'restart':restart();break;case 'reset':if(confirm('确定重新开始今天吗？当前进度将重置。'))restart();break;case 'help':showHelp=true;render();break;case 'dismiss':showHelp=false;render();break;}});
// Touch-drag shortcut: choose an item, release over a yard tile. Tap-to-place remains the accessible fallback.
let dragging=null;document.querySelector('#app').addEventListener('pointerdown',e=>{const card=e.target.closest('[data-item]');if(card)dragging={uid:card.dataset.item,startX:e.clientX,startY:e.clientY}});document.querySelector('#app').addEventListener('pointerup',e=>{if(!dragging)return;const d=dragging;dragging=null;if(Math.abs(e.clientY-d.startY)<32&&Math.abs(e.clientX-d.startX)<32)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('[data-cell]');if(target){S.selected=d.uid;cellClick(Number(target.dataset.cell))}});document.querySelector('#app').addEventListener('pointercancel',()=>dragging=null);
render();
})();
</script></body></html>
