function newGame(){phase='game';time=GAME_TIME;elapsed=0;score=0;combo=0;bestCombo=0;harvest=0;perfect=0;awnings=2;protectUntil=0;stormHit=new Set();paused=false;racks=[0,1,2].map(newRack);tip='点亮起绿色的竹匾！';drawGame();lastTick=performance.now();cancelAnimationFrame(frameId);frameId=requestAnimationFrame(tick)}
function rainState(){let warning=storms.find(x=>elapsed>=x-3&&elapsed<x);let raining=storms.find(x=>elapsed>=x&&elapsed<x+4.4);return {warning:warning!==undefined,raining:raining!==undefined,notice:warning!==undefined?Math.ceil(warning-elapsed):0,protected:protectUntil>elapsed}}
function drawGame(){const w=rainState();app.innerHTML=`<main class="page"><div class="header"><div class="brand"><span class="brandLogo">☀️</span><div><div class="brandName">今日宜晒</div><div class="brandSub">一碰就收 · 连续收获</div></div></div><div style="display:flex;gap:7px"><button class="btnGhost" data-action="mute" id="mute">🔊</button><button class="btnGhost" data-action="quit">⌂ 首页</button></div></div><div class="hud"><div class="stat"><span class="mini">⏳</span>剩 <b id="timer">70</b> 秒</div><div class="stat wide"><span class="mini">✨</span>得分 <b id="points">0</b></div><div class="stat"><span class="mini">🔥</span>连收 <b id="combo">0</b></div></div><div class="weatherStrip"><div class="weatherNow"><span class="symbol" id="weatherIcon">☀️</span><span id="weatherLabel">阳光正好</span></div><div class="weatherNext" id="weatherNext">晒到绿色就点！</div></div><div class="yardWrap" id="yard">${yardArt()}<div class="sceneLabel">🍂 立秋 · 晒谷坪</div><div class="awnOverlay" id="awningShade"></div><div class="rainGlass"></div><div class="rainToast" id="stormText"></div><div class="rackGrid" id="racks">${racks.map(r=>rackHTML(r)).join('')}</div></div><div class="tipline" id="tip">💡 ${tip}</div><div class="controls"><button class="roofBtn" data-action="awning" id="roof">🛖 一键开雨棚<span class="small">雨来前保护晒物 · 还可用 2 次</span></button><button class="sideBtn" data-action="pause" id="pause">⏸ 暂停</button></div><div class="footer">不用计算干度 · 绿了就点 · 失误也能继续玩</div></main>`;paint()}
function rackHTML(r){return `<button class="rack under" data-rack="${r.n}" aria-label="${r.food.name}，未晒好"><span class="rackIcon">${iSvg(r.food.id)}</span><span class="rackName">${r.food.name}</span><span class="dryTrack"><i class="sweet"></i><i class="fill"></i></span><span class="rackStatus">慢慢晒 ☀</span></button>`}
let lastRainMemo='';function paint(){if(phase!=='game')return;const w=rainState();const countdown=document.getElementById('timer'),p=document.getElementById('points'),c=document.getElementById('combo');if(!countdown)return;countdown.textContent=fmt(time+0.99);p.textContent=score;c.textContent=combo;const yard=document.getElementById('yard');yard.classList.toggle('rain',w.raining);const icon=document.getElementById('weatherIcon'),label=document.getElementById('weatherLabel'),next=document.getElementById('weatherNext');icon.textContent=w.raining?'🌧️':w.warning?'☁️':'☀️';label.textContent=w.raining?'下雨啦！':w.warning?'乌云来了！':'阳光正好';next.textContent=w.raining?(w.protected?'雨棚挡住了雨':'快点开雨棚！'):w.warning?`${w.notice} 秒后下雨 · 快开棚`:'晒到绿色就点竹匾';document.getElementById('awningShade').classList.toggle('open',w.protected);const st=document.getElementById('stormText');st.classList.toggle('show',w.warning||w.raining);st.textContent=w.warning?`🌧️ ${w.notice}秒后下雨！`:w.raining?(w.protected?'🛖 雨棚保护中':'☔ 快开雨棚！'):'';const btn=document.getElementById('roof');btn.disabled=awnings<=0||w.protected||(!w.warning&&!w.raining);btn.classList.toggle('alert',(w.warning||w.raining)&&!w.protected&&awnings>0);btn.innerHTML=`🛖 ${w.protected?'雨棚保护中':w.raining?'快开雨棚！':w.warning?'一键开雨棚':'等乌云来再开棚'}<span class="small">${w.protected?'晒物不会淋湿':`剩余 ${awnings} 次 · 下雨前开启`}</span>`;document.getElementById('tip').textContent='💡 '+tip;document.getElementById('pause').textContent=paused?'▶ 继续':'⏸ 暂停';document.getElementById('mute').textContent=soundEnabled?'🔊':'🔇';racks.forEach(r=>{const el=app.querySelector(`[data-rack="${r.n}"]`);if(!el)return;const ready=r.dry>=64&&r.dry<=87,over=r.dry>87;el.className=`rack ${ready?'ready':over?'over':'under'}`;el.querySelector('.fill').style.width=Math.min(100,r.dry)+'%';el.querySelector('.rackStatus').textContent=ready?'✨ 刚刚好！点我':over?'🍂 有点晒过啦':'☀ 慢慢晒…';el.setAttribute('aria-label',`${r.food.name}，${ready?'刚刚好，点击收获':over?'稍微晒过':'还没晒好'}`)})}
function floatText(label,n,good){const tray=document.querySelector(`[data-rack="${n}"]`),yard=document.getElementById('yard');if(!tray||!yard)return;const a=tray.getBoundingClientRect(),b=yard.getBoundingClientRect();const t=document.createElement('div');t.className='float';t.style.left=(a.left-b.left+a.width/2)+'px';t.style.top=(a.top-b.top+20)+'px';t.style.color=good?'#fff6ad':'#fff3e9';t.textContent=label;yard.appendChild(t);setTimeout(()=>t.remove(),900)}
function replaceRack(n){racks[n]=newRack(n);const el=app.querySelector(`[data-rack="${n}"]`);if(el)el.outerHTML=rackHTML(racks[n]);}
function collect(n){if(phase!=='game'||paused)return;const r=racks[n],good=r.dry>=64&&r.dry<=87;let gained=0;if(good){combo++;harvest++;perfect++;playTone(600+Math.min(300,combo*46),combo%5===0);try{navigator.vibrate?.(14)}catch(e){};bestCombo=Math.max(bestCombo,combo);gained=Math.round(r.food.value*Math.min(3,1+Math.floor((combo-1)/3)*.5));if(combo%5===0){gained+=65;tip='🌟 连续5次完美！额外收成+65';floatText('连击大丰收 ✨',n,true)}else tip=`漂亮！${r.food.name}晒得刚刚好`;floatText(`+${gained} ✨`,n,true)}else if(r.dry>87){combo=0;harvest++;gained=12;playTone(280);tip='有点晒过啦，下次更早一点收';floatText('+12 🍂',n,false)}else{tip='还没晒好，等竹匾变绿再点';floatText('再晒一会 ☀️',n,false);paint();return}score+=gained;replaceRack(n);paint()}
function awning(){if(phase!=='game'||paused)return;const w=rainState();if(awnings<=0||w.protected||(!w.warning&&!w.raining))return;awnings--;protectUntil=elapsed+8;playTone(520,true);tip='🛖 雨棚撑好了，所有晒物都安全！';floatText('雨棚守护 ✓',1,true);paint()}
function tick(now){if(phase!=='game')return;const dt=Math.min(.25,Math.max(0,(now-lastTick)/1000));lastTick=now;if(!paused)advance(dt);if(phase==='game')frameId=requestAnimationFrame(tick)}
function advance(dt){if(dt<=0||phase!=='game'||paused)return;const prev=elapsed;elapsed+=dt;time=Math.max(0,GAME_TIME-elapsed);for(const s of storms){if(prev<s&&elapsed>=s&&!stormHit.has(s)){stormHit.add(s);if(protectUntil<=elapsed){racks.forEach(r=>r.dry=Math.max(2,r.dry-17));combo=0;tip='☔ 淋湿了一点，没关系继续晒！'}else{tip='🛖 雨棚挡住啦，继续晒！';score+=35}}}const weather=rainState();for(const r of racks){if(weather.raining&&!weather.protected)continue;r.dry+=r.food.speed*dt*(weather.raining?.62:1);if(r.dry>=110){combo=0;tip='晒过头啦，自动换一匾继续！';replaceRack(r.n)}}if(time<=0){finish();return}paint()}
function finish(){if(phase!=='game')return;phase='end';cancelAnimationFrame(frameId);const coins=Math.floor(score/12);data.coins+=coins;data.total+=harvest;data.days++;data.best=Math.max(score,data.best);let unlocked=false;let level=data.total>=75?4:data.total>=45?3:data.total>=20?2:1;if(level>data.decor){data.decor=level;unlocked=true}save();const stars=score>=650?3:score>=340?2:score>=60?1:0;app.innerHTML=`<main class="page"><div class="header"><div class="brand"><span class="brandLogo">🌾</span><div><div class="brandName">今日宜晒</div><div class="brandSub">晒满一院好时光</div></div></div><span class="chip">第 ${data.days} 天</span></div><div class="endArt">${yardArt()}</div><h1 class="endTitle">${score>=340?'今天收成真不错！':score>0?'晒出了一点好时光':'太阳还在，明天再来！'}</h1><div class="endStars">${'★'.repeat(stars)}<span style="opacity:.25">${'☆'.repeat(3-stars)}</span></div><p class="endSummary">${perfect} 次刚刚好 · 最长 ${bestCombo} 连收</p><div class="endScore"><div><b>${score}</b><span>本局得分</span></div><div><b>+${coins}</b><span>收获铜钱</span></div><div><b>${data.best}</b><span>历史最佳</span></div></div><div class="gardenBox">${unlocked?'🎊 小院升级了！新花草已经长出来啦。':'🌱 继续晒晒，累计收成会让小院越变越美。'}<br>🧺 累计收成 <b>${data.total}</b> 件 · 🪙 铜钱 <b>${data.coins}</b></div><div class="endActions"><button class="btn" data-action="again">再晒一局　↻</button><button class="hintBtn" data-action="home">回小院</button></div><div class="footer">纯玩法测试 · 没有真实广告 · 没有充值</div></main>`}
function help(){if(modal)return;modal=true;const d=document.createElement('div');d.className='how';d.id='how';d.innerHTML=`<div class="dialog"><h2>晒晒小院 ☀️</h2><div class="howStep">① 竹匾变成 <b>绿色亮框</b>，就点它收获。</div><div class="howStep">② 连续收对会 <b>连击加分</b>！</div><div class="howStep">③ 要下雨会预警，点 <b>一键开雨棚</b>。</div><div class="howStep">🎉 70秒一局，失误也不失败。</div><button class="btn" data-action="closeHelp">开始玩吧</button></div>`;app.appendChild(d)}
app.addEventListener('click',e=>{let target=e.target.closest('[data-action],[data-rack]');if(!target)return;let cmd=target.dataset.action;if(target.dataset.rack!==undefined){collect(Number(target.dataset.rack));return}switch(cmd){case 'start':case 'again':newGame();break;case 'help':help();break;case 'closeHelp':document.getElementById('how')?.remove();modal=false;break;case 'quit':case 'home':cancelAnimationFrame(frameId);phase='home';home();break;case 'mute':soundEnabled=!soundEnabled;paint();break;case 'pause':paused=!paused;lastTick=performance.now();paint();break;case 'awning':awning();break;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='game'){paused=true;paint()}});
if(new URLSearchParams(location.search).get('qa')==='1'){window.__qa={start:newGame,step(seconds){for(let s=0;s<seconds;s+=.2)advance(Math.min(.2,seconds-s))},click:collect,awning,finish,snapshot:()=>({phase,score,combo,harvest,perfect,time,elapsed,awnings,racks:racks.map(x=>({id:x.food.id,dry:x.dry})),data:{...data}})}};
home();
})();</script></body></html>
